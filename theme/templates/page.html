{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ SITENAME }}{% endblock %}

{% block content %}
<div class="l-container" style="padding-top: 20px; padding-bottom: 66px;">
    <article class="page">
        <header>
            <h1 class="h1" style="font-size: 2.3rem; margin-bottom: 18px;">{{ page.title }}</h1>
        </header>
        <div class="entry-content">
            {{ page.content }}
        </div>
    </article>
</div>
{% endblock %}
